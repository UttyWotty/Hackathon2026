[project]
name = "cortex-workflow-agent"
version = "1.0.0"
description = "Autonomous manufacturing workflow agent powered by Snowflake Cortex"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
run-agent = "scripts.run_agent:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
]
ignore = [
  "E501", # let black handle line length
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["core", "analysis", "services", "routers", "models", "middleware", "utils", "synthetic_data", "main", "tests"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-single-line = false
combine-as-imports = true

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["core", "analysis", "services", "routers", "models", "middleware", "utils", "synthetic_data", "main", "tests"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_single_line = false
combine_as_imports = true
skip_gitignore = true
src_paths = ["src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/backend"]


