# CI workflow for the Cortex Workflow Agent.
# Runs linting (ruff), formatting checks (black, isort), and pytest.
# Currently disabled (workflow_dispatch only) pending Actions minute reset.

name: CI

on:
  workflow_dispatch:

env:
  # Disable Snowflake and Redis in CI to skip integration tests that need them.
  SNOWFLAKE_ACCOUNT: ""
  SNOWFLAKE_USER: ""
  SNOWFLAKE_PRIVATE_KEY_PATH: ""
  REDIS_URL: ""
  # Ensure the API does not attempt heavyweight init during testing.
  LANGFUSE_ENABLED: "false"
  DEBUG_MODE: "false"

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          # Pin versions so formatting checks are deterministic; unpinned
          # installs drift as new tool releases change the default style.
          pip install ruff==0.15.16 black==26.5.1 isort==8.0.1

      - name: Run ruff linter
        run: ruff check . --output-format=github

      - name: Check formatting with black
        run: black . --check --diff

      - name: Check import sorting with isort
        run: isort . --check-only --diff

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        env:
          PYTHONPATH: src/backend
        run: |
          pytest tests/ -v --tb=short -x \
            -k "not snowflake and not redis and not langfuse and not langflow"

      # Pure logic, no I/O and no Snowflake, so it needs no filtering. Runs even
      # when the suite above fails, since -x would otherwise mask its result.
      - name: Run synthetic data generator tests
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: src/backend
        run: pytest synthetic_data/tests/ -v --tb=short
