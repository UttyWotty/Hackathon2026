services:
  redis:
    image: redis:7-alpine
    container_name: manufacturing_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - manufacturing_network

  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_secret
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - manufacturing_network

  langfuse:
    image: langfuse/langfuse:2
    container_name: manufacturing_langfuse
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_secret@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: manufacturing-langfuse-secret-change-in-prod
      SALT: manufacturing-langfuse-salt-change-in-prod
    depends_on:
      langfuse-db:
        condition: service_healthy
    networks:
      - manufacturing_network

  langflow:
    image: langflowai/langflow:latest
    container_name: manufacturing_langflow
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      LANGFUSE_SECRET_KEY: sk-lf-37b1f1cb-f174-4a56-8616-d34207d84fdc
      LANGFUSE_PUBLIC_KEY: pk-lf-cc1866bd-7142-4d4f-aa10-f1123018deca
      LANGFUSE_HOST: http://langfuse:3000
      OPENAI_API_BASE: http://host.docker.internal:8081/v1
      LANGFLOW_COMPONENTS_PATH: /app/custom_components
    volumes:
      - langflow_data:/app/langflow
      - ./langflow_components:/app/custom_components
    depends_on:
      - langfuse
    networks:
      - manufacturing_network

volumes:
  redis_data:
    driver: local
  langfuse_db_data:
    driver: local
  langflow_data:
    driver: local

networks:
  manufacturing_network:
    driver: bridge

# ==================================================================================================
# Manufacturing Analytics - Redis Cache
# ==================================================================================================
#
# This Docker Compose file provides Redis for query result caching.
#
# USAGE:
#
# Start Redis:
#   docker-compose up -d
#
# Stop Redis:
#   docker-compose down
#
# View logs:
#   docker-compose logs -f redis
#
# Check status:
#   docker-compose ps
#
# Connect to Redis CLI:
#   docker-compose exec redis redis-cli
#
# NOTES:
#
# - Redis is OPTIONAL - the system works without it (in-memory fallback)
# - Data persists in Docker volume 'redis_data'
# - Max memory: 512MB with LRU eviction policy
# - Port 6379 (default Redis port)
#
# ==================================================================================================

